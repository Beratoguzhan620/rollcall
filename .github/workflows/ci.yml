name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Rollcall.slnx

      - name: Build
        run: dotnet build Rollcall.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/Rollcall.Application.Tests/Rollcall.Application.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Check for model changes without a migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.9
          dotnet ef migrations has-pending-model-changes --project src/Rollcall.Data --startup-project src/Rollcall.Web --no-build --configuration Release

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Check the app
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ > /dev/null; then break; fi
            sleep 3
          done
          fail() { echo "::error::$1"; docker compose logs --no-color web | tail -50; exit 1; }
          curl -sf http://localhost:8080/ | grep -q "Bugünkü yoklama" || fail "dashboard did not render"
          curl -sf http://localhost:8080/classes | grep -q "9-A" || fail "demo classes are missing"
          curl -sf -o grades.xlsx -w '%{content_type}\n' "http://localhost:8080/exams/export?classId=1&format=xlsx" | grep -q "spreadsheetml" || fail "grade book export failed"
          unzip -l grades.xlsx | grep -q "xl/worksheets/sheet1.xml" || fail "grade book is not a workbook"
          curl -sf "http://localhost:8080/attendance/export?classId=1&format=csv" | grep -q "Ad soyad" || fail "attendance export failed"
          echo "Rollcall is up and exports work."

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
